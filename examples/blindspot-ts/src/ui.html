<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colors — from DESIGN.md */
    --void: oklch(0.08 0.02 270);
    --surface: oklch(0.12 0.02 270);
    --surface-raised: oklch(0.16 0.02 270);
    --border: oklch(0.22 0.02 270);
    --text: oklch(0.92 0.01 270);
    --text-muted: oklch(0.55 0.02 270);
    --text-dim: oklch(0.38 0.02 270);
    --accent: oklch(0.72 0.18 270);
    --accent-glow: oklch(0.72 0.18 270 / 0.15);
    --risk-low: oklch(0.68 0.15 145);
    --risk-moderate: oklch(0.75 0.15 75);
    --risk-high: oklch(0.65 0.22 25);

    /* Motion — from DESIGN.md */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-shatter: cubic-bezier(0.4, 0, 0.2, 1);
    --duration-fast: 160ms;
    --duration-standard: 240ms;
    --duration-deliberate: 400ms;
    --duration-cinematic: 800ms;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    letter-spacing: -0.01em;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 0;
  }

  /* ── Wordmark ── */
  .wordmark {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    position: absolute;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    animation: fadeIn var(--duration-standard) var(--ease-out) 200ms forwards;
  }

  /* ── Search bar ── */
  .search-container {
    width: 100%;
    max-width: 440px;
    margin-bottom: 3rem;
    transition: all var(--duration-standard) var(--ease-out);
  }

  .search-container.compact {
    max-width: 320px;
    margin-bottom: 2rem;
  }

  .search-form {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: -0.01em;
    outline: none;
    transition: border-color var(--duration-fast) var(--ease-out),
                background var(--duration-fast) var(--ease-out);
  }

  .search-input::placeholder {
    color: var(--text-dim);
  }

  .search-input:focus {
    border-color: var(--accent);
    background: var(--surface-raised);
  }

  .search-container.compact .search-form {
    gap: 0;
  }

  .search-container.compact .search-input {
    border: none;
    background: transparent;
    font-size: 0.875rem;
    color: var(--text-muted);
    padding: 0.25rem 0;
    cursor: default;
  }

  .search-container.compact .search-input:focus {
    border: none;
    background: transparent;
  }

  .search-container.compact .submit-btn {
    display: none;
  }

  .submit-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-out),
                background var(--duration-fast) var(--ease-out);
  }

  .submit-btn:hover {
    background: var(--surface-raised);
  }

  .submit-btn:active {
    transform: scale(0.97);
  }

  /* ── Orb stage ── */
  .orb-stage {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity var(--duration-deliberate) var(--ease-out),
                transform var(--duration-deliberate) var(--ease-out);
    pointer-events: none;
  }

  .orb-stage.visible {
    opacity: 1;
    transform: scale(1);
  }

  .orb-stage.shattering {
    opacity: 0;
    transform: scale(0.8);
    transition: opacity var(--duration-cinematic) var(--ease-shatter),
                transform var(--duration-cinematic) var(--ease-shatter);
  }

  .orb {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
      oklch(0.82 0.20 270 / 0.9),
      oklch(0.72 0.18 270 / 0.6) 40%,
      oklch(0.72 0.18 270 / 0.1) 70%,
      transparent 100%);
    box-shadow: 0 0 60px var(--accent-glow);
    animation: breathe 3s var(--ease-in-out) infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  .orb.pulsing {
    animation: pulse var(--duration-deliberate) var(--ease-in-out);
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* Canvas overlay for shatter particles */
  .shatter-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ── Phase text (inside orb) ── */
  .phase-text {
    position: absolute;
    color: var(--text-dim);
    font-size: 0.875rem;
    text-align: center;
    width: 180px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    opacity: 0;
    transition: opacity var(--duration-standard) var(--ease-out);
    pointer-events: none;
    user-select: none;
  }

  .phase-text.visible {
    opacity: 1;
  }

  /* ── Status line ── */
  .status-line {
    margin-top: 2.5rem;
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    display: flex;
    gap: 0.75rem;
    opacity: 0;
    transition: opacity var(--duration-standard) var(--ease-out);
  }

  .status-line.visible {
    opacity: 1;
  }

  .status-word {
    opacity: 0.5;
    transition: opacity var(--duration-deliberate) var(--ease-out);
  }

  .status-word.active {
    opacity: 1;
  }

  /* ── Finale ── */
  .finale {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    pointer-events: none;
  }

  .finale.visible {
    pointer-events: auto;
  }

  .finale-item {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity var(--duration-standard) var(--ease-out),
                transform var(--duration-standard) var(--ease-out);
  }

  .finale-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .risk-score {
    font-size: 4rem;
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .risk-label {
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .privacy-verdict {
    font-size: 0.875rem;
    color: var(--text-muted);
    margin-top: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .finale-buttons {
    display: flex;
    gap: 0.75rem;
  }

  .finale-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.625rem 1.25rem;
    color: var(--text);
    font-family: inherit;
    font-size: 0.875rem;
    cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-out),
                background var(--duration-fast) var(--ease-out);
  }

  .finale-btn:hover {
    background: var(--surface-raised);
  }

  .finale-btn:active {
    transform: scale(0.97);
  }

  /* ── Error state ── */
  .error-msg {
    color: var(--risk-high);
    font-size: 0.875rem;
    text-align: center;
    max-width: 400px;
    opacity: 0;
    transition: opacity var(--duration-standard) var(--ease-out);
  }

  .error-msg.visible {
    opacity: 1;
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .orb {
      animation: none;
    }
    .orb.pulsing {
      animation: none;
    }
    .orb-stage {
      transition: opacity 200ms ease;
    }
    .finale-item {
      transform: none;
      transition: opacity 200ms ease;
    }
  }

  /* ── Touch device hover gating ── */
  @media (hover: none) {
    .submit-btn:hover,
    .finale-btn:hover {
      background: transparent;
    }
  }
</style>
</head>
<body>

<div class="wordmark">BLINDSPOT</div>

<div class="search-container" id="searchContainer">
  <form class="search-form" id="searchForm">
    <input
      type="text"
      class="search-input"
      id="searchInput"
      placeholder="Enter an ENS name to investigate"
      autocomplete="off"
      spellcheck="false"
      autocapitalize="off"
    >
    <button type="submit" class="submit-btn">→</button>
  </form>
</div>

<div class="orb-stage" id="orbStage">
  <div class="orb" id="orb"></div>
  <canvas class="shatter-canvas" id="shatterCanvas" width="200" height="200"></canvas>
  <div class="phase-text" id="phaseText"></div>
</div>

<div class="status-line" id="statusLine">
  <span class="status-word" id="word-hidden">hidden</span>
  <span>·</span>
  <span class="status-word" id="word-residential">residential</span>
  <span>·</span>
  <span class="status-word" id="word-ephemeral">ephemeral</span>
</div>

<div class="finale" id="finale">
  <div class="finale-item risk-score" id="riskScore"></div>
  <div class="finale-item risk-label" id="riskLabel"></div>
  <div class="finale-item privacy-verdict" id="privacyVerdict"></div>
  <div class="finale-item finale-buttons">
    <button class="finale-btn" id="downloadBtn">Download report</button>
    <button class="finale-btn" id="newInvestigationBtn">New investigation</button>
  </div>
</div>

<div class="error-msg" id="errorMsg"></div>

<script>
(function() {
  "use strict";

  // ── DOM refs ──
  const searchContainer = document.getElementById("searchContainer");
  const searchForm = document.getElementById("searchForm");
  const searchInput = document.getElementById("searchInput");
  const orbStage = document.getElementById("orbStage");
  const orb = document.getElementById("orb");
  const phaseText = document.getElementById("phaseText");
  const statusLine = document.getElementById("statusLine");
  const wordHidden = document.getElementById("word-hidden");
  const wordResidential = document.getElementById("word-residential");
  const wordEphemeral = document.getElementById("word-ephemeral");
  const finale = document.getElementById("finale");
  const riskScore = document.getElementById("riskScore");
  const riskLabel = document.getElementById("riskLabel");
  const privacyVerdict = document.getElementById("privacyVerdict");
  const downloadBtn = document.getElementById("downloadBtn");
  const newInvestigationBtn = document.getElementById("newInvestigationBtn");
  const errorMsg = document.getElementById("errorMsg");
  const canvas = document.getElementById("shatterCanvas");
  const ctx = canvas.getContext("2d");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let reportPath = null;
  let phaseTimer = null;

  // ── Phase text cycling ──
  const phaseMessages = {
    "resolving": { working: "resolving ENS name...", done: null },
    "sandbox": { working: "spawning ephemeral sandbox...", done: null },
    "proxy": { working: "connecting residential proxy...", done: null },
    "onchain": { working: "fetching onchain data...", done: null },
    "offchain": { working: "enriching off-chain context...", done: null },
    "analyzing": { working: "analyzing risk...", done: null },
  };

  function showPhaseText(text) {
    clearTimeout(phaseTimer);
    phaseText.classList.remove("visible");
    phaseTimer = setTimeout(() => {
      phaseText.textContent = text;
      phaseText.classList.add("visible");
    }, 240); // wait for fade out
  }

  function showPhaseResult(text, holdMs) {
    clearTimeout(phaseTimer);
    phaseText.classList.remove("visible");
    phaseTimer = setTimeout(() => {
      phaseText.textContent = text;
      phaseText.classList.add("visible");
      if (holdMs) {
        setTimeout(() => {
          phaseText.classList.remove("visible");
        }, holdMs);
      }
    }, 240);
  }

  function pulseOrb() {
    if (reduceMotion) return;
    orb.classList.remove("pulsing");
    void orb.offsetWidth; // force reflow to restart animation
    orb.classList.add("pulsing");
  }

  function activateStatusWord(word) {
    [wordHidden, wordResidential, wordEphemeral].forEach(w => w.classList.remove("active"));
    if (word === "hidden") wordHidden.classList.add("active");
    else if (word === "residential") wordResidential.classList.add("active");
    else if (word === "ephemeral") wordEphemeral.classList.add("active");
  }

  // ── Shatter effect ──
  function shatter() {
    if (reduceMotion) {
      orbStage.classList.add("shattering");
      return;
    }

    const cx = 100, cy = 100;
    const particles = [];
    const count = 24;

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
      const speed = 1.5 + Math.random() * 2.5;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 2 + Math.random() * 3,
        life: 1,
        decay: 0.012 + Math.random() * 0.008,
      });
    }

    orbStage.classList.add("shattering");
    canvas.style.opacity = "1";

    function animate() {
      ctx.clearRect(0, 0, 200, 200);
      let alive = false;
      for (const p of particles) {
        if (p.life <= 0) continue;
        alive = true;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= p.decay;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `oklch(0.72 0.18 270 / ${p.life * 0.8})`;
        ctx.fill();
      }
      if (alive) requestAnimationFrame(animate);
      else ctx.clearRect(0, 0, 200, 200);
    }
    animate();
  }

  // ── Finale cascade ──
  function showFinale(data) {
    const riskColor = data.riskScore >= 60 ? "var(--risk-high)"
      : data.riskScore >= 30 ? "var(--risk-moderate)" : "var(--risk-low)";

    riskScore.textContent = data.riskScore;
    riskScore.style.color = riskColor;
    riskLabel.textContent = data.riskLabel;
    riskLabel.style.color = riskColor;
    privacyVerdict.textContent = data.privacyVerdict;
    reportPath = data.reportPath;

    finale.classList.add("visible");

    const items = finale.querySelectorAll(".finale-item");
    const delay = reduceMotion ? 0 : 60;

    items.forEach((item, i) => {
      setTimeout(() => item.classList.add("visible"), delay * (i + 1));
    });
  }

  // ── Reset ──
  function reset() {
    finale.classList.remove("visible");
    finale.querySelectorAll(".finale-item").forEach(i => i.classList.remove("visible"));
    orbStage.classList.remove("visible", "shattering");
    statusLine.classList.remove("visible");
    phaseText.classList.remove("visible");
    phaseText.textContent = "";
    errorMsg.classList.remove("visible");
    ctx.clearRect(0, 0, 200, 200);
    searchContainer.classList.remove("compact");
    searchInput.value = "";
    searchInput.readOnly = false;
    searchInput.focus();
    activateStatusWord(null);
  }

  // ── Start investigation ──
  function startInvestigation(name) {
    searchInput.readOnly = true;
    searchContainer.classList.add("compact");
    errorMsg.classList.remove("visible");
    finale.classList.remove("visible");
    finale.querySelectorAll(".finale-item").forEach(i => i.classList.remove("visible"));

    // Materialize orb
    setTimeout(() => {
      orbStage.classList.add("visible");
      statusLine.classList.add("visible");
    }, 200);

    // Start SSE connection
    const url = `/investigate?name=${encodeURIComponent(name)}`;
    const eventSource = new EventSource(url);

    eventSource.onmessage = function(e) {
      const event = JSON.parse(e.data);
      handleEvent(event, eventSource);
    };

    eventSource.onerror = function() {
      eventSource.close();
    };
  }

  function handleEvent(event, eventSource) {
    switch (event.type) {
      case "started":
        showPhaseText(`investigating ${event.ensName}...`);
        break;

      case "phase":
        if (event.status === "working") {
          const msg = phaseMessages[event.phase]?.working;
          if (msg) showPhaseText(msg);
          // Activate status word based on phase
          if (event.phase === "resolving") activateStatusWord("hidden");
          else if (event.phase === "sandbox") activateStatusWord("ephemeral");
          else if (event.phase === "proxy") activateStatusWord("residential");
          else if (event.phase === "onchain") activateStatusWord("ephemeral");
          else if (event.phase === "offchain") activateStatusWord("residential");
        } else if (event.status === "done") {
          if (event.detail) {
            showPhaseResult(event.detail, 1000);
            pulseOrb();
          }
        }
        break;

      case "ens:resolved":
        showPhaseResult(event.address, 1000);
        pulseOrb();
        break;

      case "sandbox:booted":
        showPhaseResult(event.sandboxId.slice(0, 16) + "...", 800);
        pulseOrb();
        break;

      case "browser:connected":
        if (event.egressIp && event.egressIp !== "detecting...") {
          showPhaseResult(`${event.egressIp} (${event.proxyCountry.toUpperCase()})`, 800);
          pulseOrb();
        }
        break;

      case "mobula:data":
        showPhaseResult(
          `$${formatCompact(event.totalValueUSD)} · ${event.assetCount} assets`,
          1000
        );
        pulseOrb();
        break;

      case "offchain:data":
        showPhaseResult(`${event.sourceCount} sources`, 800);
        pulseOrb();
        break;

      case "analyzing":
        showPhaseText("analyzing risk...");
        activateStatusWord("hidden");
        break;

      case "complete":
        eventSource.close();
        // Shatter the orb, then show finale
        setTimeout(() => {
          shatter();
          setTimeout(() => showFinale(event.report), reduceMotion ? 200 : 600);
        }, 400);
        break;

      case "error":
        eventSource.close();
        orbStage.classList.remove("visible");
        statusLine.classList.remove("visible");
        errorMsg.textContent = event.message;
        errorMsg.classList.add("visible");
        searchContainer.classList.remove("compact");
        searchInput.readOnly = false;
        break;
    }
  }

  function formatCompact(n) {
    if (n === undefined || n === null) return "?";
    const abs = Math.abs(n);
    if (abs >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (abs >= 1e3) return (n / 1e3).toFixed(1) + "K";
    return n.toFixed(0);
  }

  // ── Event listeners ──
  searchForm.addEventListener("submit", function(e) {
    e.preventDefault();
    const name = searchInput.value.trim();
    if (!name) return;
    startInvestigation(name);
  });

  newInvestigationBtn.addEventListener("click", reset);

  downloadBtn.addEventListener("click", function() {
    if (reportPath) {
      // The report is a local file — open it
      window.open("/report?path=" + encodeURIComponent(reportPath), "_blank");
    }
  });

  // Focus search on load
  searchInput.focus();
})();
</script>
</body>
</html>

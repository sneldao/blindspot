<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(0.98 0.005 85);
    --ink: oklch(0.15 0.01 270);
    --ink-muted: oklch(0.45 0.01 270);
    --ink-dim: oklch(0.65 0.005 270);
    --accent: oklch(0.62 0.14 40);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    letter-spacing: -0.01em;
    overflow-x: hidden;
  }

  /* 3D canvas — fixed, fills viewport */
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
  }

  /* DOM overlays — positioned above canvas */
  .overlay {
    position: fixed;
    z-index: 10;
    transition: opacity 400ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Search overlay (Panel 0) */
  #search-overlay {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  #search-overlay h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  #search-overlay p {
    font-size: 1rem;
    color: var(--ink-muted);
  }

  #search-form {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-top: 1rem;
  }

  #search-input {
    width: 320px;
    padding: 0.75rem 1rem;
    border: 1px solid oklch(0.80 0.005 270);
    border-radius: 8px;
    background: oklch(0.96 0.008 75);
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 160ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  #search-input::placeholder { color: var(--ink-dim); }
  #search-input:focus { border-color: var(--accent); }

  #search-form button {
    padding: 0.75rem 1.25rem;
    border: 1px solid oklch(0.80 0.005 270);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
                background 160ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  #search-form button:hover { background: oklch(0.94 0.008 80); }
  #search-form button:active { transform: scale(0.97); }

  /* Loading text */
  #loading-text {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.875rem;
    color: var(--ink-muted);
    opacity: 0;
    pointer-events: none;
  }

  /* Error text */
  #error-text {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.875rem;
    color: oklch(0.58 0.20 25);
    max-width: 400px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
  }

  /* Verdict overlay (Panel 4 buttons) */
  #verdict-overlay {
    bottom: 3rem; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.75rem;
    opacity: 0;
    pointer-events: none;
  }

  .verdict-btn {
    padding: 0.625rem 1.25rem;
    border: 1px solid oklch(0.80 0.005 270);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.875rem;
    cursor: pointer;
    transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
                background 160ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .verdict-btn:hover { background: oklch(0.94 0.008 80); }
  .verdict-btn:active { transform: scale(0.97); }

  /* Chart tooltip */
  #tooltip {
    position: fixed;
    z-index: 20;
    background: var(--ink);
    color: var(--paper);
    padding: 0.375rem 0.625rem;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    pointer-events: none;
    display: none;
    white-space: nowrap;
  }

  /* Touch device hover gating */
  @media (hover: none) {
    #search-form button:hover,
    .verdict-btn:hover { background: transparent; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .overlay { transition: opacity 200ms ease; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="overlay" id="search-overlay">
  <h1>Blindspot</h1>
  <p>Privacy-preserving onchain investigation</p>
  <form id="search-form">
    <input
      type="text"
      id="search-input"
      placeholder="Enter an ENS name"
      autocomplete="off"
      spellcheck="false"
      autocapitalize="off"
    >
    <button type="submit">&rarr;</button>
  </form>
</div>

<div class="overlay" id="loading-text">connecting...</div>
<div class="overlay" id="error-text"></div>

<div class="overlay" id="verdict-overlay">
  <button class="verdict-btn" id="download-btn">Download report</button>
  <button class="verdict-btn" id="new-btn">New investigation</button>
</div>

<div id="tooltip"></div>

<script type="module" src="/bundle.js"></script>
</body>
</html>
